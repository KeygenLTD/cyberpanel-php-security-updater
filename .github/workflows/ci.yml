name: safety-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: shellcheck bin/php-security-update
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile updater.py
  almalinux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: ['8', '10']
    container: almalinux:${{ matrix.major }}
    steps:
      - run: dnf -y install git python3 python3-dnf rpm-build
      - uses: actions/checkout@v4
      - name: Policy and real DNF integration in temporary RPM root
        env:
          LSPHP_CONTAINER_TEST: '1'
        run: python3 -m unittest discover -s tests -v
